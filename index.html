<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="和暦こよみ">
<link rel="manifest" href="manifest.json">
<title>和暦こよみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1c1e;
    --paper: #faf7f2;
    --washi: #f0ebe0;
    --accent: #8b4513;
    --gold: #c8952a;
    --mist: #9e9e9e;
    --season-spring: #e8a0b4;
    --season-summer: #4a9e6b;
    --season-autumn: #d4692a;
    --season-winter: #4a6fa5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250,247,242,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(139,69,19,0.15);
    padding: 16px 20px 12px;
  }

  .header-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .app-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--ink);
  }

  .app-title span {
    color: var(--accent);
  }

  .today-btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    padding: 6px 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  /* NAV TABS */
  nav {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    padding: 0 20px;
    border-bottom: 1px solid rgba(139,69,19,0.1);
    background: rgba(250,247,242,0.92);
  }

  nav button {
    flex: 1;
    padding: 12px 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    color: var(--mist);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* MAIN */
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
  }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== TODAY SCREEN ===== */
  .date-banner {
    animation: fadeUp 0.5s ease;
    margin-bottom: 12px;
  }

  .top-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 0;
  }

  /* 日付カード */
  .date-card {
    background: #7a9bbf;
    border-radius: 16px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    flex-shrink: 0;
  }

  .gregorian-date {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }

  .big-day {
    font-family: 'Noto Serif JP', serif;
    font-size: 48px;
    font-weight: 300;
    line-height: 1;
    color: #fff;
    margin-bottom: 3px;
  }

  .big-day-label {
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.1em;
  }

  /* 旧暦カード（top-row内） */
  .kyureki-card-top {
    background: var(--washi);
    border: 1px solid rgba(139,69,19,0.12);
    border-radius: 16px;
    padding: 13px 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .kyureki-top-label {
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.18em;
    margin-bottom: 7px;
  }

  .kyureki-top-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }

  .kyureki-top-daynum {
    font-family: 'Noto Serif JP', serif;
    font-size: 38px;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }

  .kyureki-top-right {}

  .kyureki-top-monthname {
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  .kyureki-top-daykanji {
    font-size: 11px;
    color: var(--mist);
  }

  .kyureki-top-meta {
    border-top: 0.5px solid rgba(139,69,19,0.12);
    padding-top: 6px;
  }

  .kyureki-top-romaji {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 1px;
  }

  .kyureki-top-meaning {
    font-size: 11px;
    color: var(--mist);
    line-height: 1.5;
  }

  /* Season card */
  .season-card {
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .season-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.07;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .season-label {
    font-size: 13px;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
    opacity: 0.7;
  }

  .season-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .season-romaji {
    font-size: 13px;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  .season-dates {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }

  .progress-bar-wrap {
    background: rgba(0,0,0,0.1);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: currentColor;
    transition: width 1s ease;
  }

  .progress-label {
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 0.05em;
  }

  /* Sekki colors */
  .card-spring { background: #fdf0f4; color: #6b2d4a; }
  .card-summer { background: #eef7f1; color: #1a4d31; }
  .card-autumn { background: #fdf3ec; color: #7a3010; }
  .card-winter { background: #ecf0f8; color: #1a2f5a; }

  /* Kou card */
  .kou-card {
    background: var(--washi);
    border: 1px solid rgba(139,69,19,0.12);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  .kou-label {
    font-size: 13px;
    color: var(--mist);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  .kou-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .kou-romaji {
    font-size: 13px;
    color: var(--mist);
    letter-spacing: 0.1em;
    margin-bottom: 14px;
  }

  .kou-desc {
    font-size: 15px;
    line-height: 1.9;
    color: #444;
    border-left: 2px solid var(--accent);
    padding-left: 14px;
  }

  /* Nature note */
  .nature-note {
    background: linear-gradient(135deg, #fdf8f0 0%, #f8f0e8 100%);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease 0.3s both;
  }

  .nature-note-title {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  .nature-note-text {
    font-size: 15px;
    line-height: 1.8;
    color: #555;
  }

  /* ===== CALENDAR SCREEN ===== */
  .calendar-year-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .year-nav-btn {
    background: none;
    border: 1px solid rgba(139,69,19,0.25);
    color: var(--accent);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .year-display {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    letter-spacing: 0.1em;
  }

  .calendar-list { }

  .sekki-row {
    display: flex;
    align-items: stretch;
    margin-bottom: 2px;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .sekki-row:hover { transform: translateX(3px); }

  .sekki-row.today-row {
    box-shadow: 0 2px 12px rgba(139,69,19,0.2);
  }

  .sekki-stripe {
    width: 4px;
    flex-shrink: 0;
  }

  .sekki-content {
    flex: 1;
    padding: 14px 16px;
    background: var(--washi);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sekki-row.today-row .sekki-content {
    background: #fff8f0;
  }

  .sekki-left {}

  .sekki-date-label {
    font-size: 13px;
    color: var(--mist);
    margin-bottom: 3px;
    letter-spacing: 0.05em;
  }

  .sekki-cal-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  .sekki-right {
    text-align: right;
  }

  .sekki-season-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  .badge-spring { background: #fce8f0; color: #9e3a6a; }
  .badge-summer { background: #e4f5eb; color: #1a6b40; }
  .badge-autumn { background: #fdeee4; color: #8b3a10; }
  .badge-winter { background: #e8edf8; color: #2a3f7a; }

  .kou-mini-list {
    display: none;
    padding: 8px 16px 14px 20px;
    background: #fffdf9;
    border-top: 1px solid rgba(139,69,19,0.08);
  }

  .kou-mini-list.open { display: block; }

  .kou-mini-item {
    font-size: 14px;
    color: #555;
    padding: 6px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    letter-spacing: 0.03em;
    line-height: 1.6;
  }

  /* ===== DETAIL SCREEN ===== */
  .detail-back {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    cursor: pointer;
    color: var(--accent);
    font-size: 13px;
    background: none;
    border: none;
    padding: 0;
  }

  .detail-hero {
    border-radius: 16px;
    padding: 32px 24px;
    margin-bottom: 20px;
    text-align: center;
  }

  .detail-season-char {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .detail-sekki-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .detail-sekki-romaji {
    font-size: 14px;
    letter-spacing: 0.15em;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .detail-sekki-dates {
    font-size: 15px;
    opacity: 0.7;
  }

  .detail-section {
    background: var(--washi);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .detail-section-title {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 12px;
  }

  .detail-desc {
    font-size: 15px;
    line-height: 1.9;
    color: #444;
  }

  .kou-detail-item {
    padding: 14px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .kou-detail-item:last-child { border-bottom: none; }

  .kou-detail-number {
    font-size: 12px;
    color: var(--mist);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .kou-detail-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .kou-detail-romaji {
    font-size: 13px;
    color: var(--mist);
    margin-bottom: 8px;
  }

  .kou-detail-desc {
    font-size: 15px;
    line-height: 1.8;
    color: #555;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Notification banner */
  .notif-banner {
    background: #f0f8ff;
    border: 1px solid #b0d4f0;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: fadeUp 0.5s ease 0.4s both;
  }

  .notif-icon { font-size: 20px; }

  .notif-text { font-size: 14px; color: #2a6096; line-height: 1.5; flex: 1; }

  .notif-btn {
    font-size: 11px;
    padding: 6px 12px;
    background: #2a6096;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .stripe-spring { background: var(--season-spring); }
  .stripe-summer { background: var(--season-summer); }
  .stripe-autumn { background: var(--season-autumn); }
  .stripe-winter { background: var(--season-winter); }

  .today-marker {
    font-size: 9px;
    background: var(--accent);
    color: white;
    padding: 2px 6px;
    border-radius: 10px;
    letter-spacing: 0.05em;
    margin-left: 8px;
  }



  /* 日の出・日の入りカード（統合のため非表示） */
  .sun-card {
    display: none;
  }

  .sun-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .sun-card-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.2em;
  }

  .sun-location {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .sun-location-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    animation: sunpulse 2s ease-in-out infinite;
  }

  @keyframes sunpulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.6); }
  }

  .sun-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .sun-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sun-item-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .sun-item-body {}

  .sun-item-label {
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.1em;
    margin-bottom: 1px;
  }

  .sun-item-time {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--ink);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .sun-daylen-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(200,149,42,0.12);
  }

  .sun-daylen-item {
    text-align: center;
  }

  .sun-daylen-label {
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }

  .sun-daylen-value {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: 0.03em;
  }

  .sun-loading {
    text-align: center;
    font-size: 12px;
    color: var(--mist);
    padding: 8px 0;
    letter-spacing: 0.1em;
  }


  /* ===== 文ふみ文案カード ===== */
  .fumi-card {
    background: var(--washi);
    border: 1px solid rgba(139,69,19,0.12);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease 0.35s both;
  }

  .fumi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .fumi-title {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.2em;
  }

  .fumi-kou-badge {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.05em;
  }

  /* タブ */
  .fumi-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(139,69,19,0.1);
    padding-bottom: 10px;
  }

  .fumi-tab {
    flex: 1;
    padding: 7px 4px;
    background: none;
    border: 1px solid rgba(139,69,19,0.18);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--mist);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }

  .fumi-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 書き出し・結び切替 */
  .fumi-type-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .fumi-type-btn {
    flex: 1;
    padding: 6px;
    background: none;
    border: 1px solid rgba(139,69,19,0.15);
    border-radius: 6px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    color: var(--mist);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }

  .fumi-type-btn.active {
    background: rgba(139,69,19,0.08);
    color: var(--accent);
    border-color: rgba(139,69,19,0.3);
  }

  /* 文案表示エリア */
  .fumi-body {
    min-height: 80px;
  }

  .fumi-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    color: var(--mist);
    font-size: 13px;
  }

  .fumi-spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(139,69,19,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .fumi-text-block {
    font-size: 14px;
    line-height: 2.0;
    color: #444;
    padding: 2px 0;
  }

  .fumi-text-block.fade-in {
    animation: fadeUp 0.4s ease both;
  }

  .fumi-copy-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 8px 16px;
    background: none;
    border: 1px solid rgba(139,69,19,0.25);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }

  .fumi-copy-btn:hover {
    background: rgba(139,69,19,0.06);
  }

  .fumi-copy-btn.copied {
    color: #4a9e6b;
    border-color: #4a9e6b;
  }

  .fumi-error {
    font-size: 13px;
    color: #c0392b;
    line-height: 1.7;
    padding: 8px 0;
  }

  .fumi-regenerate {
    font-size: 11px;
    color: var(--mist);
    background: none;

// ===== LOGIC =====
let calYear = new Date().getFullYear();
let currentDetailId = null;
let fromScreen = 'calendar';

function getSeason(sekkiId) {
  return SEKKI[sekkiId].season;
}

function getSekkiDate(year, sekkiId) {
  const s = SEKKI[sekkiId];
  return new Date(year, s.month - 1, s.day);
}

function getSekkiTime(year, s) {
  // 節気の正確な開始日時（JST）を返す
  return new Date(year, s.month - 1, s.day, s.hour || 0, s.minute || 0, 0);
}

function getCurrentSekki(date) {
  const year = date.getFullYear();
  const nowMs = date.getTime();

  // 当年・前年・翌年の節気時刻を生成して判定
  for (let yi = -1; yi <= 1; yi++) {
    const y = year + yi;
    for (let i = 0; i < SEKKI.length; i++) {
      const ni = (i + 1) % SEKKI.length;
      const ny = ni === 0 ? y + 1 : y;

      const startMs = getSekkiTime(y, SEKKI[i]).getTime();
      const endMs   = getSekkiTime(ny, SEKKI[ni]).getTime();

      if (nowMs >= startMs && nowMs < endMs) {
        return {
          sekkiId: i,
          startDate: new Date(startMs),
          endDate:   new Date(endMs),
        };
      }
    }
  }

  // フォールバック：冬至
  const lastStart = getSekkiTime(year - 1, SEKKI[23]);
  const lastEnd   = getSekkiTime(year, SEKKI[0]);
  return { sekkiId: 23, startDate: lastStart, endDate: lastEnd };
}

function getCurrentKou(date, sekkiId, startDate, endDate) {
  // 節気の期間を3等分して候を決定（時刻基準）
  const totalMs = endDate - startDate;
  const elapsedMs = date - startDate;
  const kouIndex = Math.min(Math.floor(elapsedMs / (totalMs / 3)), 2);
  return { kouIndex, kou: KOU[sekkiId][kouIndex] };
}

function getSeasonClass(season) {
  const map = { spring: 'spring', summer: 'summer', autumn: 'autumn', winter: 'winter' };
  return map[season] || 'spring';
}

function getSeasonEmoji(season) {
  const map = { spring: '🌸', summer: '🌿', autumn: '🍂', winter: '❄️' };
  return map[season] || '🌸';
}

function formatDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

let _sunLat = null, _sunLon = null, _sunLocationName = '取得中…';

function retryGeo() {

function initSunLocation() {
  if (!navigator.geolocation) {

    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      _sunLat = pos.coords.latitude;
      _sunLon = pos.coords.longitude;
      reverseGeocodeForSun(_sunLat, _sunLon);
      calcAndRenderSun();

function reverseGeocodeForSun(lat, lon) {
  fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja`)
    .then(r => r.json())
    .then(data => {
      const a = data.address;
      _sunLocationName = a.prefecture || a.state || a.city || '現在地';
      document.getElementById('sun-location-name').textContent = _sunLocationName;

      fetchAndRenderWeather(_sunLat, _sunLon, _sunLocationName);
    });
}

function toJDsun(date) { return date.getTime() / 86400000 + 2440587.5; }

function calcSunTimesNOAA(date, lat, lon) {
  const JD = toJDsun(date);
  const T = (JD - 2451545.0) / 36525.0;
  const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
  const M = (357.52911 + T * (35999.05029 - 0.0001537 * T)) * Math.PI / 180;
  const C = (1.914602 - T * (0.004817 + 0.000014 * T)) * Math.sin(M)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M)
          + 0.000289 * Math.sin(3 * M);
  const sunLon = L0 + C;
  const omega = (125.04 - 1934.136 * T) * Math.PI / 180;
  const lambda = (sunLon - 0.00569 - 0.00478 * Math.sin(omega)) * Math.PI / 180;
  const eps0 = 23.0 + (26.0 + (21.448 - T * (46.8150 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = (eps0 + 0.00256 * Math.cos(omega)) * Math.PI / 180;
  const sinDec = Math.sin(eps) * Math.sin(lambda);
  const dec = Math.asin(sinDec);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const y = Math.tan(eps / 2) ** 2;
  const L0r = L0 * Math.PI / 180;
  const EoT = 4 * (180 / Math.PI) * (
    y * Math.sin(2 * L0r) - 2 * e * Math.sin(M)
    + 4 * e * y * Math.sin(M) * Math.cos(2 * L0r)
    - 0.5 * y * y * Math.sin(4 * L0r)
    - 1.25 * e * e * Math.sin(2 * M)
  );
  const cosH = (Math.cos(90.833 * Math.PI / 180) - Math.sin(lat * Math.PI / 180) * sinDec)
             / (Math.cos(lat * Math.PI / 180) * Math.cos(dec));
  if (cosH < -1 || cosH > 1) return null; // 白夜・極夜
  const H = Math.acos(cosH) * 180 / Math.PI;
  const tzOffset = 9 * 60;
  const solarNoon = 720 - 4 * lon - EoT + tzOffset;
  const base = new Date(date); base.setHours(0, 0, 0, 0);
  return {
    sunrise: base.getTime() + (solarNoon - H * 4) * 60000,
    sunset:  base.getTime() + (solarNoon + H * 4) * 60000,
  };
}

function fmtTime(ms) {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function fmtDuration(ms) {
  const total = Math.round(ms / 60000);
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${h}時間${m}分`;
}

function calcAndRenderSun() {
  if (_sunLat === null) return;
  const now = new Date();
  const times = calcSunTimesNOAA(now, _sunLat, _sunLon);
  if (!times) {
    document.getElementById('sun-card-body').innerHTML =
      '<div class="sun-loading">この地域は白夜または極夜のため計算できません</div>';
    return;
  }
  _sunriseMs = times.sunrise;
  _sunsetMs  = times.sunset;
  const dayLen  = _sunsetMs - _sunriseMs;
  const nightLen = 86400000 - dayLen;

  const sunSection = document.getElementById('weather-sun-section');
  const sunGrid = document.getElementById('weather-sun-grid');
  if (sunSection && sunGrid) {
    sunGrid.innerHTML = `
      <div class="weather-sun-item">

const DAY_KANJI = ['','一','二','三','四','五','六','七','八','九','十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',

// UTC基準のユリウス日
function toJDutc(date) {
  return date.getTime() / 86400000 + 2440587.5;
}

// Jean Meeus "Astronomical Algorithms" の新月epoch (UTC)
function moonAgeM(jd) {
  const epoch = 2451550.958623; // 国立天文台データで補正済みのJD
  const synodic = 29.530588853;
  return ((jd - epoch) % synodic + synodic) % synodic;
}

// JDを日本時刻のDateに変換
function jdToJSTDate(jd) {
  return new Date((jd - 2440587.5) * 86400000 + 9 * 3600000);
}

// 指定JD以降の次の新月JDを返す
function nextNewMoonAfter(afterJD) {
  let jd = afterJD + (29.530588853 - moonAgeM(afterJD));
  let minAge = 999, minJD = jd;
  const base = Math.floor(jd);
  for (let m = -1440; m <= 2880; m++) {
    const t = base + m / 1440;
    const a = moonAgeM(t);
    if (a < minAge) { minAge = a; minJD = t; }
    else if (minAge < 0.001 && a > minAge) break;
  }
  return minJD;
}

// 朔日（JST日付の0時）を返す
function getSakuDay(nmJD) {
  const d = jdToJSTDate(nmJD);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

// キャッシュ（年ごとに朔日リストを保持）
let _sakuCache = {};
function getSakuList(year) {
  if (_sakuCache[year]) return _sakuCache[year];
  const list = [];
  let jd = toJDutc(new Date(year - 1, 10, 1)); // 前年11月から
  jd = nextNewMoonAfter(jd);
  for (let i = 0; i < 16; i++) {
    list.push(getSakuDay(jd));
    jd = nextNewMoonAfter(jd + 20);
  }
  _sakuCache[year] = list;
  return list;
}

function calcKyureki(date) {
  const year = date.getFullYear();
  const t = date.getTime();
  const sakuList = getSakuList(year);

  // どの朔月に属するか
  let sakuIdx = -1;
  for (let i = 0; i < sakuList.length - 1; i++) {
    if (t >= sakuList[i].getTime() && t < sakuList[i + 1].getTime()) {
      sakuIdx = i;
      break;
    }
  }
  if (sakuIdx === -1) return null;

  const dayOfMonth = Math.floor((t - sakuList[sakuIdx].getTime()) / 86400000) + 1;
  const sakuDate = sakuList[sakuIdx];
  const nextSaku = sakuList[sakuIdx + 1];

  // この朔〜次朔の間に含まれる中気を探して月名を決定
  let foundIdx = -1;
  for (let yOff = -1; yOff <= 1 && foundIdx === -1; yOff++) {
    const y = sakuDate.getFullYear() + yOff;
    for (const c of CHUKI_LIST) {
      const chukiDate = new Date(y, c.mo - 1, c.day);
      const chukiT = chukiDate.getTime();
      if (chukiT >= sakuDate.getTime() && chukiT < nextSaku.getTime()) {
        foundIdx = c.idx;
        break;
      }
    }
  }

  const monthData = foundIdx >= 0 ? KYUREKI_MONTHS[foundIdx] : KYUREKI_MONTHS[0];
  return {
    day: dayOfMonth,
    dayKanji: DAY_KANJI[Math.min(dayOfMonth, 30)] || String(dayOfMonth),
    monthNum: monthData.num,
    monthName: monthData.name,
    romaji: monthData.romaji,
    meaning: monthData.meaning,
  };
}

function getMoonPhase(age) {
  // 月齢0〜29.53を8相に分類
  if (age < 1.5  || age >= 28.0) return { icon: '🌑', name: '新月'     };
  if (age < 6.4)                 return { icon: '🌒', name: '三日月'   };
  if (age < 10.4)                return { icon: '🌓', name: '上弦の月' };
  if (age < 13.5)                return { icon: '🌔', name: '十日夜'   };
  if (age < 16.1)                return { icon: '🌕', name: '満月'     };
  if (age < 19.5)                return { icon: '🌖', name: '十六夜'   };
  if (age < 25.0)                return { icon: '🌗', name: '下弦の月' };
  return { icon: '🌘', name: '晦日月' };
}

// Meeus "Astronomical Algorithms" Ch.49 精密朔望計算
function _meeusNewMoon(k) {
  const T = k / 1236.85;
  let JDE = 2451550.09766 + 29.530588861 * k
    + 0.00015437 * T * T
    - 0.000000150 * T * T * T
    + 0.00000000073 * T * T * T * T;
  const M  = (2.5534 + 29.10535670 * k - 0.0000014 * T * T) * Math.PI / 180;
  const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T * T + 0.00001238 * T * T * T) * Math.PI / 180;
  const F  = (160.7108 + 390.67050284 * k - 0.0016118 * T * T - 0.00000227 * T * T * T) * Math.PI / 180;
  const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T * T) * Math.PI / 180;
  JDE += -0.40720 * Math.sin(Mp)
       + 0.17241 * Math.sin(M)
       + 0.01608 * Math.sin(2 * Mp)
       + 0.01039 * Math.sin(2 * F)
       + 0.00739 * Math.sin(Mp - M)
       - 0.00514 * Math.sin(Mp + M)
       + 0.00208 * Math.sin(2 * M)
       - 0.00111 * Math.sin(Mp - 2 * F)
       - 0.00057 * Math.sin(Mp + 2 * F)
       + 0.00056 * Math.sin(2 * Mp + M)
       - 0.00042 * Math.sin(3 * Mp)
       + 0.00042 * Math.sin(M + 2 * F)
       + 0.00038 * Math.sin(M - 2 * F)
       - 0.00024 * Math.sin(2 * Mp - M)
       - 0.00017 * Math.sin(Om)
       - 0.00007 * Math.sin(Mp + 2 * M);
  return JDE;
}

function _kBase(date) {
  const y = date.getFullYear() + (date.getMonth()) / 12;
  return Math.round((y - 2000) * 12.3685);

    .filter(e => e.type === 'new' && e.date.getTime() > afterMs)
    .sort((a, b) => a.date - b.date)[0];
  if (found) return found.date.getTime() / 86400000 + 2440587.5;
  return _meeusNextNew(afterJD);
}

function nextFullMoonJD(afterJD) {
  const afterMs = (afterJD - 2440587.5) * 86400000;
  const found = MOON_EVENTS_2026
    .filter(e => e.type === 'full' && e.date.getTime() > afterMs)
    .sort((a, b) => a.date - b.date)[0];
  if (found) return found.date.getTime() / 86400000 + 2440587.5;
  return _meeusNextFull(afterJD);
}

function _meeusNextNew(afterJD) {
  const afterDate = new Date((afterJD - 2440587.5) * 86400000);
  let k = _kBase(afterDate) - 1;
  for (let i = 0; i < 4; i++) {
    const jd = _meeusNewMoon(k);
    if (jd > afterJD) return jd;
    k++;
  }
  return _meeusNewMoon(k);
}

function _meeusNextFull(afterJD) {
  const afterDate = new Date((afterJD - 2440587.5) * 86400000);
  let k = _kBase(afterDate) - 1;
  for (let i = 0; i < 4; i++) {
    const jd = _meeusNewMoon(k + 0.5);
    if (jd > afterJD) return jd;
    k++;
  }
  return _meeusNewMoon(k + 0.5);
}



function fmtMoonTime(jdOrDate) {
  // DateオブジェクトまたはJDを受け取ってJST時刻文字列を返す
  let d;
  if (jdOrDate instanceof Date) {
    d = jdOrDate;
  } else {
    const utcMs = (jdOrDate - 2440587.5) * 86400000;
    d = new Date(utcMs);
  }
  // UTC基準でJST(+9h)を計算
  const jstH = (d.getUTCHours() + 9) % 24;
  const jstM = d.getUTCMinutes();
  const jstDay = new Date(d.getTime() + 9 * 3600000);
  const mo = jstDay.getUTCMonth() + 1;
  const da = jstDay.getUTCDate();
  return `${mo}/${da} ${String(jstH).padStart(2,'0')}:${String(jstM).padStart(2,'0')}`;
}

function renderKyureki() {
  const now = new Date();
  const ky = calcKyureki(now);
  if (!ky) return;
  document.getElementById('kyureki-day-num').textContent = ky.day;
  document.getElementById('kyureki-day-kanji').textContent = ky.dayKanji + '日';
  document.getElementById('kyureki-month-name').textContent = ky.monthName;
  document.getElementById('kyureki-month-romaji').textContent = `${ky.romaji}　旧暦${ky.monthNum}月`;
  document.getElementById('kyureki-month-meaning').textContent = ky.meaning;

  // 月齢・月相
  const jd = toJDutc(now);
  const age = moonAgeM(jd);
  const phase = getMoonPhase(age);
  document.getElementById('kyureki-moon-icon').textContent = phase.icon;
  document.getElementById('kyureki-moon-name').textContent = phase.name;
  document.getElementById('kyureki-moon-age').textContent = `月齢 ${age.toFixed(1)}`;
  document.getElementById('kyureki-moon-row').style.display = 'flex';

  const timeEl = document.getElementById('kyureki-moon-time');
  const nextEl = document.getElementById('kyureki-moon-next');
  timeEl.style.display = 'none';
  nextEl.style.display = 'none';

  const synodic = 29.530588853;

  if (age < 1.5 || age >= 28.0) {
    // 新月当日 → 新月時刻を表示
    const nmJD = nextNewMoonJD(jd - 2); // 直近の朔を探す
    const nmDate = MOON_EVENTS_2026.find(e => e.type==='new' && Math.abs(e.date.getTime()/86400000+2440587.5 - nmJD) < 0.1);
    const nmTime = nmDate ? fmtMoonTime(nmDate.date) : fmtMoonTime(nmJD);
    timeEl.textContent = `🌑 新月 ${nmTime}`;
    timeEl.style.display = 'block';
  } else if (age >= 13.5 && age < 16.1) {
    // 満月当日 → 満月時刻を表示
    const fmJD = nextFullMoonJD(jd - 2);
    const fmDate = MOON_EVENTS_2026.find(e => e.type==='full' && Math.abs(e.date.getTime()/86400000+2440587.5 - fmJD) < 0.1);
    const fmTime = fmDate ? fmtMoonTime(fmDate.date) : fmtMoonTime(fmJD);
    timeEl.textContent = `🌕 満月 ${fmTime}`;
    timeEl.style.display = 'block';
  } else {
    // それ以外 → 次の満月・新月までの日数を表示
    const nextNM = nextNewMoonJD(jd);
    const nextFM = nextFullMoonJD(jd);
    const daysToNM = Math.ceil((nextNM - jd) * 10) / 10;
    const daysToFM = Math.ceil((nextFM - jd) * 10) / 10;

    // 近い方を優先
    if (daysToNM <= daysToFM) {
      const nextNMDate = MOON_EVENTS_2026.find(e => e.type==='new' && Math.abs(e.date.getTime()/86400000+2440587.5 - nextNM) < 0.1);
      nextEl.textContent = `次の新月 ${nextNMDate ? fmtMoonTime(nextNMDate.date) : fmtMoonTime(nextNM)}`;
    } else {
      const nextFMDate = MOON_EVENTS_2026.find(e => e.type==='full' && Math.abs(e.date.getTime()/86400000+2440587.5 - nextFM) < 0.1);
      nextEl.textContent = `次の満月 ${nextFMDate ? fmtMoonTime(nextFMDate.date) : fmtMoonTime(nextFM)}`;
    }
    nextEl.style.display = 'block';
  }
}

// ===== 時候の文案（プリセット方式）=====
let _fumiCurrentKou = '';
let _fumiGender = 'f';
let _fumiType = 'opening';

function switchFumiGender(gender, btn) {
  _fumiGender = gender;
  document.querySelectorAll('.fumi-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  showFumi();
}

function switchFumiType(type, btn) {
  _fumiType = type;
  document.querySelectorAll('.fumi-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  showFumi();
}

function getFumiText() {
  const entry = FUMI_PRESET[_fumiCurrentKou];
  if (!entry) return null;
  const key = `${_fumiGender}_${_fumiType}`;
  return entry[key] || null;
}

function showFumi() {
  const text = getFumiText();
  const body = document.getElementById('fumi-body');
  if (!text) {
    body.innerHTML = '<div class="fumi-error">この候の文案はまだ登録されていません。</div>';
    return;
  }
  body.innerHTML = `
    <div class="fumi-text-block fade-in">${text}</div>
    <button class="fumi-copy-btn" onclick="copyFumi(this)">
      <span>📋</span> コピー
    </button>
  `;
}

function copyFumi(btn) {
  const text = document.querySelector('.fumi-text-block')?.innerText || '';
  navigator.clipboard?.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '<span>✓</span> コピーしました';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>📋</span> コピー';
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.innerHTML = '<span>✓</span> コピーしました';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>📋</span> コピー';
    }, 2000);
  });
}

function initFumi(kouName) {
  _fumiCurrentKou = kouName;
  document.getElementById('fumi-kou-badge').textContent = kouName;
  showFumi();
}

// ===== RENDER TODAY =====
function renderToday() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const wday = WEEKDAYS[now.getDay()];

  document.getElementById('gregorian-date').textContent = 
    `${year}年${month}月`;
  document.getElementById('today-day').textContent = day;
  document.getElementById('today-weekday').textContent = `${wday}曜日`;

  const { sekkiId, startDate, endDate } = getCurrentSekki(now);
  const sekki = SEKKI[sekkiId];
  const season = sekki.season;
  const sc = getSeasonClass(season);

  const card = document.getElementById('today-sekki-card');
  card.className = `season-card card-${sc}`;

  document.getElementById('today-sekki-name').textContent = sekki.name;
  document.getElementById('today-sekki-romaji').textContent = sekki.romaji;
  document.getElementById('today-sekki-dates').textContent = 
    `${formatDate(startDate)} 〜 ${formatDate(endDate)}`;

  const total = endDate - startDate;
  const elapsed = now - startDate;
  const pct = Math.round((elapsed / total) * 100);
  document.getElementById('sekki-progress').style.width = `${pct}%`;
  document.getElementById('sekki-progress-label').textContent = 
    `節気の ${pct}% が経過しました`;

  const { kouIndex, kou } = getCurrentKou(now, sekkiId, startDate, endDate);
  document.getElementById('today-kou-name').textContent = kou.name;
  document.getElementById('today-kou-romaji').textContent = kou.romaji;
  document.getElementById('today-kou-desc').textContent = kou.desc;
  document.getElementById('today-nature').textContent = sekki.nature;

  renderKyureki();
  initFumi(kou.name);
  if (_sunLat === null) initSunLocation();
  else calcAndRenderSun();

  // Notification banner
  if ('Notification' in window && Notification.permission === 'default') {
    document.getElementById('notif-banner').style.display = 'flex';
  }
}

// ===== RENDER CALENDAR =====
function renderCalendar() {
  document.getElementById('cal-year-display').textContent = `${calYear}年`;
  const list = document.getElementById('calendar-list');
  list.innerHTML = '';

  const today = new Date();

  SEKKI.forEach((s, i) => {
    const date = getSekkiDate(calYear, i);
    const nextDate = i < SEKKI.length - 1 ? getSekkiDate(calYear, i + 1) : getSekkiDate(calYear + 1, 0);
    const sc = getSeasonClass(s.season);
    
    const isToday = today >= date && today < nextDate && today.getFullYear() === calYear;
    const todayCls = isToday ? ' today-row' : '';

    const sekkiDateStr = `${date.getMonth()+1}月${date.getDate()}日`;
    const seasonNames = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };

    const row = document.createElement('div');
    row.innerHTML = `
      <div class="sekki-row${todayCls}" onclick="toggleKouList(${i}, this)">
        <div class="sekki-stripe stripe-${sc}"></div>
        <div class="sekki-content">
          <div class="sekki-left">
            <div class="sekki-date-label">${sekkiDateStr}〜${isToday ? `<span class="today-marker">今日</span>` : ''}</div>
            <div class="sekki-cal-name">${s.name}</div>
          </div>
          <div class="sekki-right">
            <span class="sekki-season-badge badge-${sc}">${seasonNames[s.season]}</span>
          </div>
        </div>
      </div>
      <div class="kou-mini-list" id="kou-list-${i}">
        ${KOU[i].map((k, ki) => `<div class="kou-mini-item">第${ki+1}候　${k.name}（${k.romaji}）</div>`).join('')}
      </div>
    `;
    list.appendChild(row);

    if (isToday) {
      setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }
  });
}

function toggleKouList(id, el) {
  const list = document.getElementById(`kou-list-${id}`);
  list.classList.toggle('open');
}

function changeYear(delta) {
  calYear += delta;
  renderCalendar();
}

// ===== RENDER DETAIL LIST =====
function renderDetailList() {
  const container = document.getElementById('detail-list-content');
  container.innerHTML = '';

  SEKKI.forEach((s, i) => {
    const sc = getSeasonClass(s.season);
    const seasonEmoji = getSeasonEmoji(s.season);
    const div = document.createElement('div');
    div.style.cssText = 'margin-bottom: 12px; cursor: pointer;';
    div.innerHTML = `
      <div class="sekki-row" onclick="showDetail(${i}, 'detail-list')">
        <div class="sekki-stripe stripe-${sc}"></div>
        <div class="sekki-content">
          <div class="sekki-left">
            <div class="sekki-date-label">${s.month}月${s.day}日頃〜</div>
            <div class="sekki-cal-name">${s.name}</div>
          </div>
          <div style="font-size:22px">${seasonEmoji}</div>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

// ===== DETAIL SCREEN =====
function showDetail(sekkiId, from) {
  fromScreen = from || 'detail-list';
  currentDetailId = sekkiId;
  const s = SEKKI[sekkiId];
  const sc = getSeasonClass(s.season);
  const seasonEmoji = getSeasonEmoji(s.season);

  const content = document.getElementById('detail-content');
  content.innerHTML = `
    <div class="detail-hero card-${sc}">
      <div class="detail-season-char">${seasonEmoji}</div>
      <div class="detail-sekki-name">${s.name}</div>
      <div class="detail-sekki-romaji">${s.romaji} — ${s.en}</div>
      <div class="detail-sekki-dates">${s.month}月${s.day}日頃〜</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">✦ 節気について</div>
      <div class="detail-desc">${s.desc}</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">✦ 自然のたより</div>
      <div class="detail-desc">${s.nature}</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">✦ 七十二候</div>
      ${KOU[sekkiId].map((k, ki) => `
        <div class="kou-detail-item">
          <div class="kou-detail-number">第${sekkiId * 3 + ki + 1}候</div>
          <div class="kou-detail-name">${k.name}</div>
          <div class="kou-detail-romaji">${k.romaji}</div>
          <div class="kou-detail-desc">${k.desc}</div>
        </div>
      `).join('')}
    </div>
  `;

  // Show detail screen
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-detail').classList.add('active');
  window.scrollTo(0, 0);
}

function backFromDetail() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${fromScreen}`).classList.add('active');
  
  // Update nav
  const navMap = { 'today': 0, 'calendar': 1, 'detail-list': 2 };
  const navBtns = document.querySelectorAll('nav button');
  navBtns.forEach((btn, i) => {
    btn.classList.toggle('active', i === (navMap[fromScreen] ?? 2));
  });
}

// ===== NAVIGATION =====
function showScreen(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (name === 'calendar') renderCalendar();
  if (name === 'detail-list') renderDetailList();
}

function goToday() {
  const navBtns = document.querySelectorAll('nav button');
  showScreen('today', navBtns[0]);
}

// ===== NOTIFICATIONS =====
function requestNotif() {
  if ('Notification' in window) {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        document.getElementById('notif-banner').style.display = 'none';
        new Notification('和暦こよみ', {
          body: '節気の変わり目をお知らせします 🌸',
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌸</text></svg>'
        });
      }
    });
  }
}

// ===== INIT =====
renderToday();
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        // 新バージョンが見つかったら自動で更新
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'activated') {
              window.location.reload();
            }
          });
        });
      });
  });
}
</script>
